<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/log.jpeg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mahamat Mahamat Tahir — Full-Stack Developer building exceptional web & mobile experiences with React, React Native, Flutter and FastAPI." />
    <meta name="theme-color" content="#11110F" />
    <title>Mahamat Tahir — Full-Stack Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
          var l = localStorage.getItem('language');
          if (l === 'ar') { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; }
          else if (l) { document.documentElement.lang = l; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
